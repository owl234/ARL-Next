name: arl-next-prod

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "3"

services:
  # 前端 Nginx 容器：作为系统唯一的 HTTPS 流量网关与静态资源服务
  arl-frontend:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-frontend:latest
    container_name: arl-frontend-prod
    restart: always
    mem_reservation: 64m
    security_opt:
      - seccomp:unconfined
    ports:
      # 映射公网 5173 端口直连 Nginx 服务
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 挂载您的 SSL 证书到容器中
      - ./ssl-certs:/certs:ro
      - ./frontend/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./frontend/default.conf.prod:/etc/nginx/conf.d/default.conf
    depends_on:
      - arl-web
      - arl-mcp
    networks:
      - arl-net

  # 后端 Python Web 容器 (去除了 5000/5001 端口的公网暴露)
  arl-web:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-web:latest
    container_name: arl-web-prod
    restart: always
    mem_reservation: 256m
    oom_score_adj: 0
    command: bash -c "/code/backend/start_web_prod.sh"
    working_dir: /code
    volumes:
      - arl_screenshots:/code/backend/app/tmp_screenshot
      - arl_app_dicts:/code/backend/app/dicts
      - arl_poc_plugins:/code/backend/ARL-NPoC/xing/plugins
      - arl_poc_dicts:/code/backend/ARL-NPoC/xing/dicts
      - arl_geoip:/code/backend/GeoLite2
      - arl_backups:/code/backend/data/backups
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
      - ARL_ADMIN_PASSWORD=${ARL_ADMIN_PASSWORD:-}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - mongodb
      - rabbitmq
      - osint-service
      - arl-puppeteer
    networks:
      - arl-net

  # Puppeteer 无头浏览器渲染专属微服务 (常驻 HTTP 服务，解决 CPU 瓶颈)
  arl-puppeteer:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-puppeteer:latest
    container_name: arl-puppeteer-prod
    restart: always
    mem_reservation: 256m
    oom_score_adj: 300
    command: bash -c "export NODE_PATH=/usr/local/lib/node_modules && node /code/backend/app/tools/puppeteer_server.js"
    working_dir: /code
    environment:
      - TZ=Asia/Shanghai
    networks:
      - arl-net

  # MCP 远程协议与 AI Agent 接入专属微服务 (原生异步长连接与渐进式工具调度)
  arl-mcp:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-web:latest
    container_name: arl-mcp-prod
    restart: always
    mem_reservation: 64m
    command: bash -c "while [ ! -f /code/backend/start_mcp_prod.sh ]; do sleep 1; done; exec /code/backend/start_mcp_prod.sh"
    working_dir: /code
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
      - ARL_MCP_ENABLE_DISPATCH=${ARL_MCP_ENABLE_DISPATCH:-false}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - arl-net

  # 后台扫描任务 Worker
  arl-worker:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-worker:latest
    container_name: arl-worker-prod
    restart: always
    mem_reservation: 512m
    oom_score_adj: 500
    stop_grace_period: 1m
    command: bash -c "/code/backend/start_worker_prod.sh"
    working_dir: /code
    volumes:
      - arl_screenshots:/code/backend/app/tmp_screenshot
      - arl_app_dicts:/code/backend/app/dicts
      - arl_poc_plugins:/code/backend/ARL-NPoC/xing/plugins
      - arl_poc_dicts:/code/backend/ARL-NPoC/xing/dicts
      - arl_geoip:/code/backend/GeoLite2
      - arl_backups:/code/backend/data/backups
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "cd /code/backend && /code/backend/.venv-docker/bin/celery -A app.celerytask.celery inspect ping || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    depends_on:
      - mongodb
      - rabbitmq
      - osint-service
    networks:
      - arl-net

  # MongoDB 数据库 (去除了 ports "27018:27017" 的外网暴露)
  mongodb:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/mongo:7.0
    container_name: arl-mongodb-prod
    restart: always
    mem_reservation: 512m
    oom_score_adj: -500
    # MongoDB 启动时会校验 fd 上限，默认软限制 1024 会触发官方警告
    # （recommendedMinimum 为 64000）。ARL 的资产/服务集合较多，
    # 并发查询与索引扫描会同时持有大量文件描述符，故与 web/worker 对齐为 65535。
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      - MONGO_INITDB_DATABASE=arl
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - TZ=Asia/Shanghai
    volumes:
      - mongo_data_v7:/data/db
    networks:
      - arl-net

  # RabbitMQ 队列 (去除了 ports "5673:5672" 和 "15673:15672" 的外网暴露)
  rabbitmq:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/rabbitmq:3-alpine
    container_name: arl-rabbitmq-prod
    restart: always
    mem_reservation: 128m
    oom_score_adj: -500
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - TZ=Asia/Shanghai
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout 2592000000
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arl-net

  # 备案查询微服务 (去除了 ports 暴露)
  osint-service:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/osint-service:latest
    container_name: arl-osint-service-prod
    restart: always
    mem_reservation: 64m
    networks:
      - arl-net

  # 容器级自愈探针护盾 (自动检测死锁并急救)
  autoheal:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/autoheal:latest
    container_name: arl-autoheal
    restart: always
    mem_reservation: 32m
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - TZ=Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arl-net

networks:
  arl-net:
    driver: bridge

volumes:
  mongo_data_v7:
  rabbitmq_data:
  arl_screenshots:
  arl_app_dicts:
  arl_poc_plugins:
  arl_poc_dicts:
  # GeoIP 数据库命名卷：由宿主机 start-prod.sh 经 tools/fetch_geoip.py 预填充
  # （ip2region 直链+校验 / GeoLite2 需 MAXMIND_LICENSE_KEY），库文件不再随镜像分发
  arl_geoip:
  # 数据一键全量备份命名卷：持久化备份包归档，容器重新拉取重建不丢失历史备份
  arl_backups:

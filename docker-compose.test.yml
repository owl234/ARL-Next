name: arl-next-prod

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "3"

services:
  # 前端 Nginx 容器：作为系统唯一的 HTTPS 流量网关与静态资源服务
  arl-frontend:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/arl-frontend:latest
    container_name: arl-frontend-test
    restart: always
    ports:
      # 映射公网 5173 端口直连 Nginx 服务
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 挂载您的 SSL 证书到容器中
      - ./ssl-certs:/certs:ro
      - ./frontend/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./frontend/default.conf.test:/etc/nginx/conf.d/default.conf
    depends_on:
      - arl-web
    networks:
      - arl-net

  # 后端 Python Web 容器 (去除了 5000/5001 端口的公网暴露)
  arl-web:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/arl-web:latest
    container_name: arl-web-test
    restart: always
    command: bash -c "/code/backend/start_web_prod.sh"
    working_dir: /code
    volumes:
      - arl_screenshots_test:/code/backend/app/tmp_screenshot
      - arl_poc_plugins_test:/code/backend/ARL-NPoC/xing/plugins
      - arl_poc_dicts_test:/code/backend/ARL-NPoC/xing/dicts
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - mongodb
      - rabbitmq
      - osint-service
      - arl-puppeteer
    networks:
      - arl-net

  # Puppeteer 无头浏览器渲染专属微服务 (常驻 HTTP 服务，解决 CPU 瓶颈)
  arl-puppeteer:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/arl-puppeteer:latest
    container_name: arl-puppeteer-test
    restart: always
    command: bash -c "export NODE_PATH=/usr/local/lib/node_modules && node /code/backend/app/tools/puppeteer_server.js"
    working_dir: /code
    environment:
      - TZ=Asia/Shanghai
    networks:
      - arl-net


  # 后台扫描任务 Worker
  arl-worker:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/arl-worker:latest
    container_name: arl-worker-test
    restart: always
    stop_grace_period: 1m
    command: bash -c "/code/backend/start_worker_prod.sh"
    working_dir: /code
    volumes:
      - arl_screenshots_test:/code/backend/app/tmp_screenshot
      - arl_poc_plugins_test:/code/backend/ARL-NPoC/xing/plugins
      - arl_poc_dicts_test:/code/backend/ARL-NPoC/xing/dicts
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "cd /code/backend && /code/backend/.venv-docker/bin/celery -A app.celerytask.celery inspect ping || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    depends_on:
      - mongodb
      - rabbitmq
      - osint-service
    networks:
      - arl-net

  # MongoDB 数据库 (去除了 ports "27018:27017" 的外网暴露)
  mongodb:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/mongo:7.0
    container_name: arl-mongodb-test
    restart: always
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      - MONGO_INITDB_DATABASE=arl
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - TZ=Asia/Shanghai
    volumes:
      - mongo_data_v7_test:/data/db
    networks:
      - arl-net

  # RabbitMQ 队列 (去除了 ports "5673:5672" 和 "15673:15672" 的外网暴露)
  rabbitmq:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/rabbitmq:3-management
    container_name: arl-rabbitmq-test
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - TZ=Asia/Shanghai
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout 2592000000
    volumes:
      - rabbitmq_data_test:/var/lib/rabbitmq
    networks:
      - arl-net

  # 备案查询微服务 (去除了 ports 暴露)
  osint-service:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/osint-service:latest
    container_name: arl-osint-service-test
    restart: always
    networks:
      - arl-net

  # 容器级自愈探针护盾 (自动检测死锁并急救)
  autoheal:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod-test/autoheal:latest
    container_name: arl-autoheal-test
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - TZ=Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arl-net

networks:
  arl-net:
    driver: bridge

volumes:
  mongo_data_v7_test:
  rabbitmq_data_test:
  arl_screenshots_test:
  arl_poc_plugins_test:
  arl_poc_dicts_test:

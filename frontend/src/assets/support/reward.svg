<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="rewardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa541c"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect width="240" height="240" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="8" y="8" width="224" height="224" rx="12" fill="none" stroke="#fa541c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- 模拟二维码四角定位标 (Finder Patterns) -->
  <rect x="24" y="24" width="48" height="48" rx="8" fill="none" stroke="#fa541c" stroke-width="6"/>
  <rect x="36" y="36" width="24" height="24" rx="4" fill="#fa541c"/>

  <rect x="168" y="24" width="48" height="48" rx="8" fill="none" stroke="#fa541c" stroke-width="6"/>
  <rect x="180" y="36" width="24" height="24" rx="4" fill="#fa541c"/>

  <rect x="24" y="168" width="48" height="48" rx="8" fill="none" stroke="#fa541c" stroke-width="6"/>
  <rect x="36" y="180" width="24" height="24" rx="4" fill="#fa541c"/>

  <!-- 二维码模拟数据点 -->
  <g fill="#262626" opacity="0.85">
    <rect x="84" y="24" width="10" height="10" rx="2"/>
    <rect x="106" y="24" width="10" height="10" rx="2"/>
    <rect x="128" y="24" width="10" height="10" rx="2"/>
    <rect x="146" y="24" width="10" height="10" rx="2"/>
    <rect x="84" y="44" width="10" height="10" rx="2"/>
    <rect x="128" y="44" width="10" height="10" rx="2"/>
    <rect x="84" y="62" width="10" height="10" rx="2"/>
    <rect x="106" y="62" width="10" height="10" rx="2"/>
    <rect x="146" y="62" width="10" height="10" rx="2"/>

    <rect x="24" y="84" width="10" height="10" rx="2"/>
    <rect x="44" y="84" width="10" height="10" rx="2"/>
    <rect x="62" y="84" width="10" height="10" rx="2"/>
    <rect x="168" y="84" width="10" height="10" rx="2"/>
    <rect x="188" y="84" width="10" height="10" rx="2"/>
    <rect x="206" y="84" width="10" height="10" rx="2"/>

    <rect x="24" y="106" width="10" height="10" rx="2"/>
    <rect x="62" y="106" width="10" height="10" rx="2"/>
    <rect x="168" y="106" width="10" height="10" rx="2"/>
    <rect x="206" y="106" width="10" height="10" rx="2"/>

    <rect x="24" y="128" width="10" height="10" rx="2"/>
    <rect x="44" y="128" width="10" height="10" rx="2"/>
    <rect x="62" y="128" width="10" height="10" rx="2"/>
    <rect x="168" y="128" width="10" height="10" rx="2"/>
    <rect x="188" y="128" width="10" height="10" rx="2"/>
    <rect x="206" y="128" width="10" height="10" rx="2"/>

    <rect x="24" y="146" width="10" height="10" rx="2"/>
    <rect x="168" y="146" width="10" height="10" rx="2"/>
    <rect x="188" y="146" width="10" height="10" rx="2"/>

    <rect x="84" y="168" width="10" height="10" rx="2"/>
    <rect x="128" y="168" width="10" height="10" rx="2"/>
    <rect x="146" y="168" width="10" height="10" rx="2"/>
    <rect x="188" y="168" width="10" height="10" rx="2"/>
    <rect x="206" y="168" width="10" height="10" rx="2"/>

    <rect x="106" y="188" width="10" height="10" rx="2"/>
    <rect x="128" y="188" width="10" height="10" rx="2"/>
    <rect x="168" y="188" width="10" height="10" rx="2"/>

    <rect x="84" y="206" width="10" height="10" rx="2"/>
    <rect x="106" y="206" width="10" height="10" rx="2"/>
    <rect x="146" y="206" width="10" height="10" rx="2"/>
    <rect x="188" y="206" width="10" height="10" rx="2"/>
  </g>

  <!-- 中心徽章 -->
  <circle cx="120" cy="120" r="28" fill="#ffffff" stroke="#fa541c" stroke-width="2"/>
  <circle cx="120" cy="120" r="24" fill="url(#rewardGrad)"/>
  <text x="120" y="127" fill="#ffffff" font-size="20" text-anchor="middle">☕</text>

  <!-- 提示覆盖卡片 -->
  <rect x="20" y="96" width="200" height="48" rx="8" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="120" y="116" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">暂未配置打赏收款码</text>
  <text x="120" y="133" fill="#faad14" font-size="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">放入 reward.png 即可替换</text>
</svg>
